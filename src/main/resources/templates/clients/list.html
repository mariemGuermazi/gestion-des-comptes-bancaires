<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Liste Clients</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

<h2 class="mb-4">Liste des Clients</h2>

<a href="/clients/add" class="btn btn-primary mb-3">+ Ajouter Client</a>

<table class="table table-bordered table-striped">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Nom</th>
        <th>Prénom</th>
        <th>Email</th>
        <th>Téléphone</th>
        <th>Statut</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="c : ${clients}">
        <td th:text="${c.id}"></td>
        <td th:text="${c.nom}"></td>
        <td th:text="${c.prenom}"></td>
        <td th:text="${c.email}"></td>
        <td th:text="${c.telephone}"></td>
        <td th:text="${c.statut}"></td>
        <td>
            <a th:href="@{'/clients/edit/' + ${c.id}}" class="btn btn-sm btn-warning">Modifier</a>
            <a th:href="@{'/clients/delete/' + ${c.id}}" class="btn btn-sm btn-danger"
               onclick="return confirm('Supprimer ce client ?')">Supprimer</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>

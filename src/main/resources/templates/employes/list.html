<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="/header :: head"></head>
<body>
<div th:replace="/header :: body"></div>
<div class="container">
    <div class="d-flex justify-content-between align-items-center">
        <h2>Employés</h2>
        <a class="btn btn-success" th:href="@{/employes/add}">Ajouter employé</a>
    </div>
    <table class="table mt-3">
        <thead><tr><th>ID</th><th>Prénom</th><th>Nom</th><th>Poste</th></tr></thead>
        <tbody>
        <tr th:each="e : ${employes}">
            <td th:text="${e.id}"></td>
            <td th:text="${e.firstName}"></td>
            <td th:text="${e.lastName}"></td>
            <td th:text="${e.poste}"></td>
        </tr>
        </tbody>
    </table>
</div>
<div th:replace="/footer :: footer"></div>
</body>
</html>

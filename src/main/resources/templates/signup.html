<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Gestion Bancaire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }
        .signup-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
            max-width: 600px;
            width: 100%;
        }
        .signup-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .signup-body {
            padding: 40px;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .btn-signup {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s;
        }
        .btn-signup:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .password-toggle {
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="signup-card">
                <div class="signup-header">
                    <i class="fas fa-user-plus fa-3x mb-3"></i>
                    <h2>Créer un compte bancaire</h2>
                    <p class="mb-0">Rejoignez-nous aujourd'hui</p>
                </div>
                <div class="signup-body">
                    <!-- Messages -->
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                        <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <!-- Formulaire d'inscription -->
                    <form th:action="@{/signup}" th:object="${client}" method="post" id="signupForm">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="nom" class="form-label">
                                    <i class="fas fa-user"></i> Nom *
                                </label>
                                <input type="text"
                                       class="form-control"
                                       id="nom"
                                       th:field="*{nom}"
                                       required
                                       placeholder="Votre nom">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="prenom" class="form-label">
                                    <i class="fas fa-user"></i> Prénom *
                                </label>
                                <input type="text"
                                       class="form-control"
                                       id="prenom"
                                       th:field="*{prenom}"
                                       required
                                       placeholder="Votre prénom">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">
                                <i class="fas fa-envelope"></i> Email *
                            </label>
                            <input type="email"
                                   class="form-control"
                                   id="email"
                                   th:field="*{email}"
                                   required
                                   placeholder="votre.email@example.com">
                            <div class="form-text">Cet email sera utilisé pour vous connecter</div>
                        </div>

                        <div class="mb-3">
                            <label for="telephone" class="form-label">
                                <i class="fas fa-phone"></i> Téléphone
                            </label>
                            <input type="tel"
                                   class="form-control"
                                   id="telephone"
                                   th:field="*{telephone}"
                                   placeholder="+216 XX XXX XXX">
                        </div>

                        <div class="mb-3">
                            <label for="adresse" class="form-label">
                                <i class="fas fa-map-marker-alt"></i> Adresse
                            </label>
                            <textarea class="form-control"
                                      id="adresse"
                                      th:field="*{adresse}"
                                      rows="2"
                                      placeholder="Votre adresse complète"></textarea>
                        </div>

                        <hr class="my-4">

                        <div class="mb-3">
                            <label for="codeBancaire" class="form-label">
                                <i class="fas fa-lock"></i> Code Bancaire (4 chiffres minimum) *
                            </label>
                            <div class="input-group">
                                <input type="password"
                                       class="form-control"
                                       id="codeBancaire"
                                       th:field="*{codeBancaire}"
                                       required
                                       minlength="4"
                                       pattern="[0-9]+"
                                       placeholder="Entrez votre code">
                                <button class="btn btn-outline-secondary password-toggle" type="button" onclick="togglePassword('codeBancaire')">
                                    <i class="fas fa-eye" id="icon-codeBancaire"></i>
                                </button>
                            </div>
                            <div class="form-text">Ce code sera utilisé pour vous connecter (chiffres uniquement)</div>
                        </div>

                        <div class="mb-4">
                            <label for="confirmCodeBancaire" class="form-label">
                                <i class="fas fa-lock"></i> Confirmer le Code Bancaire *
                            </label>
                            <div class="input-group">
                                <input type="password"
                                       class="form-control"
                                       id="confirmCodeBancaire"
                                       name="confirmCodeBancaire"
                                       required
                                       minlength="4"
                                       pattern="[0-9]+"
                                       placeholder="Confirmez votre code">
                                <button class="btn btn-outline-secondary password-toggle" type="button" onclick="togglePassword('confirmCodeBancaire')">
                                    <i class="fas fa-eye" id="icon-confirmCodeBancaire"></i>
                                </button>
                            </div>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-signup btn-lg">
                                <i class="fas fa-user-plus"></i> Créer mon compte
                            </button>
                        </div>
                    </form>

                    <div class="text-center mt-4">
                        <p>Vous avez déjà un compte ?
                            <a th:href="@{/login}" class="text-decoration-none fw-bold">
                                Se connecter
                            </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function togglePassword(fieldId) {
        const field = document.getElementById(fieldId);
        const icon = document.getElementById('icon-' + fieldId);

        if (field.type === 'password') {
            field.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            field.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }

    // Validation des codes bancaires
    document.getElementById('signupForm').addEventListener('submit', function(e) {
        const code = document.getElementById('codeBancaire').value;
        const confirmCode = document.getElementById('confirmCodeBancaire').value;

        if (code !== confirmCode) {
            e.preventDefault();
            alert('Les codes bancaires ne correspondent pas !');
        }
    });
</script>
</body>
</html>

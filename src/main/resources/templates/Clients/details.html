<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Détails Client</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
<div class="container mt-5">
    <h2>Détails Client</h2>
    <table class="table table-bordered">
        <tr><th>Nom</th><td th:text="${client.nom}"></td></tr>
        <tr><th>Prénom</th><td th:text="${client.prenom}"></td></tr>
        <tr><th>Email</th><td th:text="${client.email}"></td></tr>
        <tr><th>Téléphone</th><td th:text="${client.telephone}"></td></tr>
        <tr><th>Adresse</th><td th:text="${client.adresse}"></td></tr>
        <tr><th>Date de création</th><td th:text="${client.dateCreation}"></td></tr>
        <tr><th>Statut</th><td th:text="${client.statut}"></td></tr>
    </table>
    <a href="/clients" class="btn btn-primary">Retour</a>
</div>
</body>
</html>

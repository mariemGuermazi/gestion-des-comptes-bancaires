<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Effectuer un dépôt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="#"><i class="fas fa-university"></i> Ma Banque</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <!-- Messages d'erreur -->
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card shadow">
                <div class="card-header bg-success text-white text-center">
                    <h4 class="mb-0">
                        <i class="fas fa-arrow-down"></i> Effectuer un dépôt
                    </h4>
                </div>
                <div class="card-body">
                    <!-- Informations du compte -->
                    <div class="alert alert-info">
                        <h6><strong>Compte:</strong> <span th:text="${compte.numeroCompte}"></span></h6>
                        <h6><strong>Solde actuel:</strong>
                            <span th:text="${#numbers.formatDecimal(compte.solde, 1, 2)} + ' DT'"></span>
                        </h6>
                    </div>

                    <!-- Formulaire -->
                    <form th:action="@{/client/compte/{id}/depot(id=${compte.id})}" method="post">
                        <div class="mb-3">
                            <label for="montant" class="form-label">
                                <i class="fas fa-coins"></i> Montant du dépôt (DT) *
                            </label>
                            <input type="number"
                                   class="form-control form-control-lg"
                                   id="montant"
                                   name="montant"
                                   step="0.01"
                                   min="0.01"
                                   required
                                   placeholder="Entrez le montant"
                                   autofocus>
                            <div class="form-text">Le montant doit être supérieur à 0</div>
                        </div>

                        <!-- Montants rapides -->
                        <div class="mb-3">
                            <label class="form-label">Montants rapides:</label>
                            <div class="d-grid gap-2">
                                <button type="button" class="btn btn-outline-success" onclick="document.getElementById('montant').value='50'">50 DT</button>
                                <button type="button" class="btn btn-outline-success" onclick="document.getElementById('montant').value='100'">100 DT</button>
                                <button type="button" class="btn btn-outline-success" onclick="document.getElementById('montant').value='200'">200 DT</button>
                                <button type="button" class="btn btn-outline-success" onclick="document.getElementById('montant').value='500'">500 DT</button>
                            </div>
                        </div>

                        <!-- Aperçu du nouveau solde -->
                        <div class="alert alert-success" id="preview" style="display:none;">
                            <h6><strong>Nouveau solde après dépôt:</strong>
                                <span id="nouveauSolde">0.00 DT</span>
                            </h6>
                        </div>

                        <!-- Boutons -->
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-lg">
                                <i class="fas fa-check"></i> Confirmer le dépôt
                            </button>
                            <a th:href="@{/client/compte/{id}/details(id=${compte.id})}"
                               class="btn btn-secondary">
                                <i class="fas fa-times"></i> Annuler
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    const soldeActuel = [[${compte.solde}]];

    document.getElementById('montant').addEventListener('input', function() {
        const montant = parseFloat(this.value);
        if (montant > 0) {
            const nouveauSolde = soldeActuel + montant;
            document.getElementById('nouveauSolde').textContent = nouveauSolde.toFixed(2) + ' DT';
            document.getElementById('preview').style.display = 'block';
        } else {
            document.getElementById('preview').style.display = 'none';
        }
    });
</script>
</body>
</html>

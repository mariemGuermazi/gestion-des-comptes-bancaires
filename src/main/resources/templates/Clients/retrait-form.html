<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Effectuer un retrait</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="#"><i class="fas fa-university"></i> Ma Banque</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <!-- Messages d'erreur -->
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card shadow">
                <div class="card-header bg-danger text-white text-center">
                    <h4 class="mb-0">
                        <i class="fas fa-arrow-up"></i> Effectuer un retrait
                    </h4>
                </div>
                <div class="card-body">
                    <!-- Informations du compte -->
                    <div class="alert alert-info">
                        <h6><strong>Compte:</strong> <span th:text="${compte.numeroCompte}"></span></h6>
                        <h6><strong>Solde actuel:</strong>
                            <span th:text="${#numbers.formatDecimal(compte.solde, 1, 2)} + ' DT'"></span>
                        </h6>
                        <h6><strong>Solde disponible:</strong>
                            <span class="text-success" th:text="${#numbers.formatDecimal(soldeDisponible, 1, 2)} + ' DT'"></span>
                        </h6>
                    </div>

                    <!-- Formulaire -->
                    <form th:action="@{/client/compte/{id}/retrait(id=${compte.id})}" method="post" id="retraitForm">
                        <div class="mb-3">
                            <label for="montant" class="form-label">
                                <i class="fas fa-coins"></i> Montant du retrait (DT) *
                            </label>
                            <input type="number"
                                   class="form-control form-control-lg"
                                   id="montant"
                                   name="montant"
                                   step="0.01"
                                   min="0.01"
                                   th:max="${soldeDisponible}"
                                   required
                                   placeholder="Entrez le montant"
                                   autofocus>
                            <div class="form-text">
                                Montant maximum: <span th:text="${#numbers.formatDecimal(soldeDisponible, 1, 2)} + ' DT'"></span>
                            </div>
                        </div>

                        <!-- Montants rapides -->
                        <div class="mb-3">
                            <label class="form-label">Montants rapides:</label>
                            <div class="d-grid gap-2">
                                <button type="button" class="btn btn-outline-danger" onclick="setMontant(50)">50 DT</button>
                                <button type="button" class="btn btn-outline-danger" onclick="setMontant(100)">100 DT</button>
                                <button type="button" class="btn btn-outline-danger" onclick="setMontant(200)">200 DT</button>
                                <button type="button" class="btn btn-outline-danger" onclick="setMontant(500)">500 DT</button>
                            </div>
                        </div>

                        <!-- Aperçu du nouveau solde -->
                        <div class="alert alert-warning" id="preview" style="display:none;">
                            <h6><strong>Nouveau solde après retrait:</strong>
                                <span id="nouveauSolde">0.00 DT</span>
                            </h6>
                        </div>

                        <!-- Alerte si dépassement -->
                        <div class="alert alert-danger" id="alerteDepassement" style="display:none;">
                            <i class="fas fa-exclamation-triangle"></i>
                            <strong>Attention!</strong> Le montant dépasse votre solde disponible.
                        </div>

                        <!-- Boutons -->
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-danger btn-lg" id="btnConfirmer">
                                <i class="fas fa-check"></i> Confirmer le retrait
                            </button>
                            <a th:href="@{/client/compte/{id}/details(id=${compte.id})}"
                               class="btn btn-secondary">
                                <i class="fas fa-times"></i> Annuler
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    const soldeActuel = [[${compte.solde}]];
    const soldeDisponible = [[${soldeDisponible}]];

    function setMontant(montant) {
        if (montant <= soldeDisponible) {
            document.getElementById('montant').value = montant;
            updatePreview(montant);
        } else {
            alert('Ce montant dépasse votre solde disponible!');
        }
    }

    function updatePreview(montant) {
        if (montant > 0) {
            const nouveauSolde = soldeActuel - montant;
            document.getElementById('nouveauSolde').textContent = nouveauSolde.toFixed(2) + ' DT';
            document.getElementById('preview').style.display = 'block';

            if (montant > soldeDisponible) {
                document.getElementById('alerteDepassement').style.display = 'block';
                document.getElementById('btnConfirmer').disabled = true;
            } else {
                document.getElementById('alerteDepassement').style.display = 'none';
                document.getElementById('btnConfirmer').disabled = false;
            }
        } else {
            document.getElementById('preview').style.display = 'none';
            document.getElementById('alerteDepassement').style.display = 'none';
        }
    }

    document.getElementById('montant').addEventListener('input', function() {
        const montant = parseFloat(this.value);
        updatePreview(montant);
    });
</script>
</body>
</html>

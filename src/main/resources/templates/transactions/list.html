<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="/header :: head"></head>
<body>
<div th:replace="/header :: body"></div>
<div class="container">
    <h2>Transactions</h2>
    <table class="table">
        <thead><tr><th>ID</th><th>Date</th><th>Montant</th><th>Type</th><th>Compte</th></tr></thead>
        <tbody>
        <tr th:each="t : ${transactions}">
            <td th:text="${t.id}"></td>
            <td th:text="${t.dateOperation}"></td>
            <td th:text="${t.montant}"></td>
            <td th:text="${t.type}"></td>
            <td th:text="${t.compte != null ? t.compte.numeroCompte : '-'}"></td>
        </tr>
        </tbody>
    </table>
</div>
<div th:replace="/footer :: footer"></div>
</body>
</html>

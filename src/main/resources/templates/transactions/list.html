<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Transactions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .transaction-depot {
            border-left: 4px solid #28a745;
        }
        .transaction-retrait {
            border-left: 4px solid #dc3545;
        }
        .transaction-virement {
            border-left: 4px solid #ffc107;
        }
        .montant-positif {
            color: #28a745;
            font-weight: bold;
        }
        .montant-negatif {
            color: #dc3545;
            font-weight: bold;
        }
    </style>
</head>
<body class="bg-light">
<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="#"><i class="fas fa-university"></i> Ma Banque</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/client/{id}/dashboard(id=${compte.client.id})}">
                        <i class="fas fa-home"></i> Accueil
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/client/{id}/comptes(id=${compte.client.id})}">
                        <i class="fas fa-wallet"></i> Mes Comptes
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <!-- En-tête -->
    <div class="row mb-4">
        <div class="col">
            <h2 class="text-primary">
                <i class="fas fa-exchange-alt"></i> Historique des Transactions
            </h2>
            <p class="text-muted">Compte N° <span th:text="${compte.numeroCompte}"></span></p>
        </div>
    </div>

    <!-- Informations du compte -->
    <div class="card mb-4">
        <div class="card-body">
            <div class="row">
                <div class="col-md-4">
                    <h5>Type de compte</h5>
                    <p th:text="${compte.class.simpleName == 'CompteCourant' ? 'Compte Courant' : 'Compte Épargne'}"></p>
                </div>
                <div class="col-md-4">
                    <h5>Solde actuel</h5>
                    <p class="h4" th:class="${compte.solde >= 0 ? 'montant-positif' : 'montant-negatif'}"
                       th:text="${#numbers.formatDecimal(compte.solde, 1, 2)} + ' DT'"></p>
                </div>
                <div class="col-md-4">
                    <h5>Nombre de transactions</h5>
                    <p class="h4" th:text="${transactions.size()}"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Liste des transactions -->
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0"><i class="fas fa-list"></i> Dernières Transactions</h5>
        </div>
        <div class="card-body p-0">
            <div th:if="${transactions.isEmpty()}" class="alert alert-info m-3">
                <i class="fas fa-info-circle"></i> Aucune transaction effectuée sur ce compte.
            </div>

            <div class="table-responsive" th:if="${!transactions.isEmpty()}">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                    <tr>
                        <th><i class="fas fa-calendar"></i> Date</th>
                        <th><i class="fas fa-tag"></i> Type</th>
                        <th><i class="fas fa-coins"></i> Montant</th>
                        <th><i class="fas fa-comment"></i> Description</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="transaction : ${transactions}"
                        th:class="${transaction.type.name() == 'DEPOT' ? 'transaction-depot' :
                                          (transaction.type.name() == 'RETRAIT' ? 'transaction-retrait' : 'transaction-virement')}">
                        <td th:text="${#dates.format(transaction.dateTransaction, 'dd/MM/yyyy HH:mm')}"></td>
                        <td>
                                    <span class="badge"
                                          th:classappend="${transaction.type.name() == 'DEPOT' ? 'bg-success' :
                                                          (transaction.type.name() == 'RETRAIT' ? 'bg-danger' : 'bg-warning text-dark')}">
                                        <i th:class="${transaction.type.name() == 'DEPOT' ? 'fas fa-arrow-down' :
                                                     (transaction.type.name() == 'RETRAIT' ? 'fas fa-arrow-up' : 'fas fa-exchange-alt')}"></i>
                                        <span th:text="${transaction.type.libelle}"></span>
                                    </span>
                        </td>
                        <td>
                                    <span th:class="${transaction.type.name() == 'DEPOT' ? 'montant-positif' : 'montant-negatif'}">
                                        <span th:text="${transaction.type.name() == 'DEPOT' ? '+' : '-'}"></span>
                                        <span th:text="${#numbers.formatDecimal(transaction.montant, 1, 2)} + ' DT'"></span>
                                    </span>
                        </td>
                        <td>
                            <span th:if="${transaction.description != null}" th:text="${transaction.description}"></span>
                            <span th:if="${transaction.description == null}" class="text-muted">-</span>
                            <span th:if="${transaction.type.name() == 'VIREMENT' && transaction.compteDestination != null}">
                                        <br><small class="text-muted">
                                            Vers: <span th:text="${transaction.compteDestination.numeroCompte}"></span>
                                        </small>
                                    </span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Bouton retour -->
    <div class="mt-3">
        <a th:href="@{/client/{id}/dashboard(id=${compte.client.id})}" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Retour au tableau de bord
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

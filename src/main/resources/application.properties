spring.datasource.url=jdbc:mysql://localhost:3306/gestion_bancaire?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Thymeleaf (optionnel : rechargement automatique des templates)
spring.thymeleaf.cache=false

# Server configuration - ADD THIS LINE TO FIX PORT ISSUE
server.port=8081

# Optional: Disable open-in-view warning
spring.jpa.open-in-view=false

